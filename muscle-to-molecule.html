<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving through scales: from muscle to molecule</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one tall sheet of watercolour paper; a ladder of scales whose rows share
   columns (scale · band · drawing · words · force on one log axis), opening at the
   bottom into the animated power stroke. */
:root{
  --paper:#f7f3ec;--paper-2:#efe8dc;--ink:#2a2420;--ink-2:#5b5149;--muted:#8a7e72;--rule:#d9cfc0;--scale:#8b2e20;
  --c-body:#5b5149;--c-limb:#9a6b4f;--c-belly:#c4573f;--c-fasc:#cc6448;--c-fibre:#d47250;--c-fibril:#b9733a;--c-sarc:#b45a3e;--c-actin:#ad2946;--c-myo:#e9a800;
  --mat-act:#ad2946;--mat-act-p:#e7b3bf;--mat-myo:#f2b81c;--mat-mus:#d9775d;--mat-mus-p:#f4d5c8;--mat-bone:#f1e7d3;--mat-skin:#efe6da;
  --f-hand:"Kalam","Segoe Print","Bradley Hand",cursive;--f-body:"Source Serif 4",Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  /* animation tokens (the Anima kit reads these) */
  --anatomy-page:var(--paper);--anatomy-card:var(--paper);--anatomy-paper:var(--paper);--anatomy-face:var(--paper-2);--anatomy-text:#5b5149;--anatomy-strong:#2a2420;--anatomy-muted:#8a7e72;
  --anatomy-top:#fffdf8;--anatomy-shade-0:#e2d9cb;--anatomy-shade-1:#e8e0d3;--anatomy-shade-2:#eee7dc;--anatomy-shade-3:#f3eee5;--anatomy-lit-top:#fff;--anatomy-lit-shade:#f0eae0;
  --anatomy-hi:#2a2420;--anatomy-mid:#8a7e72;--anatomy-lo:#b8ad9e;--anatomy-faint:#ddd3c4;--anatomy-lit:#1a1310;--anatomy-halo:#8a7d68;--anatomy-halo-opacity:.3;--anatomy-dot:#3a332d;
  --anatomy-blue:#3f8f4a;--anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);--anatomy-mono:var(--f-mono);
  /* character-sheet palette: actin #ad2946 (bound subunit #580810), myosin #fdb600, ATP green */
  --ac-0:#9a2340;--ac-1:#ad2946;--ac-2:#bc3a57;--ac-3:#c9536e;--ac-top:#e08ea0;--ac-edge:#6b1426;--ac-mark:#f6d6dd;--ac-bound:#4a0610;--ac-bound-edge:#1a0205;
  --my-0:#c98400;--my-2:#eea600;--my-3:#fdb600;--my-top:#ffd75e;--my-edge:#7a4a00;--my-mid:#a66d00;--my-lit:#3d2400;--my-lit-top:#ffe48f;
  --th-0:#e2ab2c;--th-1:#e9bb4a;--th-2:#f0c966;--th-3:#f5d886;--th-top:#fbebbd;--th-edge:#a66d00;--th-line:#d4a335;
  --tm-body:#d3cabd;--tm-edge:#7d7266;--nuc-a:#80c080;--nuc-a-edge:#2f6b36;--nuc-p:#3f8f4a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1714;--paper-2:#231f1b;--ink:#efe7da;--ink-2:#cbc1b4;--muted:#93887c;--rule:#3a332c;--scale:#e8957a;
  --c-body:#cbc1b4;--c-limb:#d8a283;--c-belly:#ea7f63;--c-fasc:#ee8a6c;--c-fibre:#f19a76;--c-fibril:#e2a35d;--c-sarc:#e08566;--c-actin:#e0587a;--c-myo:#f2c14a;
  --mat-act:#c43c5b;--mat-act-p:#6b2a3a;--mat-myo:#e0a520;--mat-mus:#c9644a;--mat-mus-p:#4a2e26;--mat-bone:#d9cdb5;--mat-skin:#3a332d;
  --anatomy-text:#cbc1b4;--anatomy-strong:#efe7da;--anatomy-muted:#93887c;--anatomy-top:#2a241f;--anatomy-shade-0:#141110;--anatomy-shade-1:#181513;--anatomy-shade-2:#1d1916;--anatomy-shade-3:#221d19;--anatomy-lit-top:#30291f;--anatomy-lit-shade:#241f1a;
  --anatomy-hi:#e9dfd0;--anatomy-mid:#8d8378;--anatomy-lo:#5c534a;--anatomy-faint:#3a332c;--anatomy-lit:#fff7ec;--anatomy-halo:#000;--anatomy-halo-opacity:.8;--anatomy-dot:#e9dfd0;--anatomy-blue:#8fd48f;
  --ac-0:#4a0f1d;--ac-1:#5e1426;--ac-2:#7a1b33;--ac-3:#962541;--ac-top:#c0405f;--ac-edge:#ff8aa5;--ac-mark:#ffd0db;--ac-bound:#1f0207;--ac-bound-edge:#ffb3c4;
  --my-0:#6b4300;--my-2:#a46f00;--my-3:#d39400;--my-top:#f5b400;--my-edge:#ffe08a;--my-mid:#e0a520;--my-lit:#fff6dc;--my-lit-top:#ffd04d;
  --th-0:#2e2207;--th-1:#3a2b0a;--th-2:#47350d;--th-3:#574111;--th-top:#6d5216;--th-edge:#e0a520;--th-line:#7d5f1c;
  --tm-body:#5a534a;--tm-edge:#b8ad9e;--nuc-a:#5fae63;--nuc-a-edge:#c9f0c9;--nuc-p:#8fd48f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1714;--paper-2:#231f1b;--ink:#efe7da;--ink-2:#cbc1b4;--muted:#93887c;--rule:#3a332c;--scale:#e8957a;
  --c-body:#cbc1b4;--c-limb:#d8a283;--c-belly:#ea7f63;--c-fasc:#ee8a6c;--c-fibre:#f19a76;--c-fibril:#e2a35d;--c-sarc:#e08566;--c-actin:#e0587a;--c-myo:#f2c14a;
  --mat-act:#c43c5b;--mat-act-p:#6b2a3a;--mat-myo:#e0a520;--mat-mus:#c9644a;--mat-mus-p:#4a2e26;--mat-bone:#d9cdb5;--mat-skin:#3a332d;
  --anatomy-text:#cbc1b4;--anatomy-strong:#efe7da;--anatomy-muted:#93887c;--anatomy-top:#2a241f;--anatomy-shade-0:#141110;--anatomy-shade-1:#181513;--anatomy-shade-2:#1d1916;--anatomy-shade-3:#221d19;--anatomy-lit-top:#30291f;--anatomy-lit-shade:#241f1a;
  --anatomy-hi:#e9dfd0;--anatomy-mid:#8d8378;--anatomy-lo:#5c534a;--anatomy-faint:#3a332c;--anatomy-lit:#fff7ec;--anatomy-halo:#000;--anatomy-halo-opacity:.8;--anatomy-dot:#e9dfd0;--anatomy-blue:#8fd48f;
  --ac-0:#4a0f1d;--ac-1:#5e1426;--ac-2:#7a1b33;--ac-3:#962541;--ac-top:#c0405f;--ac-edge:#ff8aa5;--ac-mark:#ffd0db;--ac-bound:#1f0207;--ac-bound-edge:#ffb3c4;
  --my-0:#6b4300;--my-2:#a46f00;--my-3:#d39400;--my-top:#f5b400;--my-edge:#ffe08a;--my-mid:#e0a520;--my-lit:#fff6dc;--my-lit-top:#ffd04d;
  --th-0:#2e2207;--th-1:#3a2b0a;--th-2:#47350d;--th-3:#574111;--th-top:#6d5216;--th-edge:#e0a520;--th-line:#7d5f1c;
  --tm-body:#5a534a;--tm-edge:#b8ad9e;--nuc-a:#5fae63;--nuc-a-edge:#c9f0c9;--nuc-p:#8fd48f;
  color-scheme:dark}

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}


.ps-stage{outline:none;border-radius:4px}
.ps-stage:focus-visible{box-shadow:0 0 0 1px var(--anatomy-mid)}
.ps-figure .iso-line{vector-effect:none}
.ps-figure .actin-bead .iso-edge{stroke-width:.5}
.ps-figure .actin-mark{fill:var(--anatomy-mid)}
.ps-figure .tropomyosin .tb-body{fill:var(--anatomy-shade-3)}
.ps-figure .thick .iso-edge{stroke-width:.6}
.ps-figure .fig-label{fill:var(--anatomy-text);font:9.5px var(--anatomy-mono);letter-spacing:.02em}
.ps-figure .fig-end{fill:var(--anatomy-muted);font:9px var(--anatomy-mono);letter-spacing:.06em;text-transform:uppercase}
.ps-figure .fig-leader{fill:none;stroke:var(--anatomy-lo);stroke-width:.6;vector-effect:non-scaling-stroke}
.ps-figure .fig-dot{fill:var(--anatomy-paper);stroke:var(--anatomy-mid);stroke-width:.6}
.ps-figure .nuc-tag{fill:var(--anatomy-strong)}
.ps-figure .fl-verb{fill:var(--anatomy-strong);font-weight:500}
/* heads */
.ps-figure .head path,.ps-figure .head circle,.ps-figure .head ellipse{vector-effect:none}
.ps-figure .hb-base{fill:var(--anatomy-shade-0)}
.ps-figure .hb-shade{fill:var(--anatomy-shade-2)}
.ps-figure .hb-light{fill:var(--anatomy-top)}
.ps-figure .hb-edge{fill:none;stroke:var(--anatomy-hi);stroke-width:.55;stroke-linejoin:round}
.ps-figure .elc .hb-edge,.ps-figure .rlc .hb-edge{stroke:var(--anatomy-mid)}
.ps-figure .elc .hb-base,.ps-figure .rlc .hb-base{fill:var(--anatomy-shade-2)}
.ps-figure .elc .hb-light,.ps-figure .rlc .hb-light{fill:var(--anatomy-shade-3)}
.ps-figure .head[data-subject] .hb-light{fill:var(--anatomy-lit-top)}
.ps-figure :is(.u50,.l50) .hb-edge{stroke:var(--anatomy-mid)}
.ps-figure .slide-note{fill:var(--anatomy-strong)}
.ps-figure .head[data-subject] :is(.motor,.converter) .hb-edge{stroke:var(--anatomy-lit);stroke-width:.8}
.ps-figure .lv-edge{fill:none;stroke:var(--anatomy-hi);stroke-linecap:round}
.ps-figure .head[data-subject] .lv-edge{stroke:var(--anatomy-lit)}
.ps-figure .lv-body{fill:none;stroke:var(--anatomy-shade-2);stroke-linecap:round}
.ps-figure .lv-shine{fill:none;stroke:var(--anatomy-top);stroke-linecap:round}
.ps-figure .s2-body{fill:none;stroke:var(--anatomy-mid);stroke-linecap:round}
.ps-figure .s2-strand{fill:none;stroke:var(--anatomy-shade-3);stroke-width:.5}
.ps-figure .s2-root{fill:var(--anatomy-shade-1);stroke:var(--anatomy-mid);stroke-width:.5}
.ps-figure .cleft{fill:none;stroke:var(--anatomy-mid);stroke-width:.55;stroke-linecap:round}
.ps-figure .pocket-hole{fill:var(--anatomy-halo);fill-opacity:.55;stroke:var(--anatomy-mid);stroke-width:.45}
.ps-figure .nuc-ado{fill:var(--anatomy-paper);stroke:var(--anatomy-hi);stroke-width:.5}
.ps-figure .nuc-p{fill:var(--anatomy-blue);stroke:var(--anatomy-paper);stroke-width:.35}
.ps-figure .head[data-parked]{opacity:.32}
.ps-figure .head{transition:opacity .6s var(--anatomy-ease)}
.ps-figure .ghost{display:none}
.ps-figure.reduced .ghost{display:inline;opacity:.35}
.ps-figure .fl{transition:opacity .4s}
.ps-figure .fl[data-off]{opacity:0}
/* cycle strip and controls */
.cycle{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;counter-reset:s}
.cycle button{width:100%;height:100%;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:7px 8px;border:1px solid var(--anatomy-faint);background:transparent;color:var(--anatomy-muted);font:10.5px/1.25 var(--anatomy-mono);letter-spacing:.02em;cursor:pointer;transition:color .3s,border-color .3s,background .3s}
.cycle .n{color:var(--anatomy-lo);font-size:10px}
.cycle button[aria-current]{color:var(--anatomy-strong);border-color:var(--anatomy-mid);background:var(--anatomy-face)}
.cycle button[aria-current] .n{color:var(--anatomy-lit)}
.cycle button:focus-visible,.ctl button:focus-visible{outline:2px solid var(--anatomy-lit);outline-offset:2px}
.ctl{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.ctl button{border:1px solid var(--anatomy-faint);background:transparent;color:var(--anatomy-text);font:11.5px var(--anatomy-mono);padding:6px 11px;cursor:pointer}
.ctl button[aria-pressed="true"]{border-color:var(--anatomy-mid);color:var(--anatomy-strong)}
.bio-sources{margin:14px auto;color:var(--anatomy-muted);font-size:12.5px;line-height:1.65}
.bio-sources b{color:var(--anatomy-text);font-weight:600}
.bio-sources a{color:var(--anatomy-text);text-underline-offset:2px}
@media (max-width:600px){.ps-figure .fig-label{font-size:15px}.ps-figure .fig-end{font-size:12.5px}.ps-figure .fl[data-for="lever"],.ps-figure .fig-callout.thin,.ps-figure .slide-note,.ps-figure .long{display:none}.cycle{grid-template-columns:repeat(3,1fr)}.iso-plate-corner[data-corner="hint"]{display:none}.iso-plate{padding:44px 10px}}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-font-smoothing:antialiased}
.sheet{max-width:1040px;margin:0 auto;padding-block:12px;display:grid;gap:0}
.top{text-align:center;display:grid;gap:6px;justify-items:center}
.top h1{margin:0;font:700 clamp(22px,3.2vw,32px)/1.1 var(--f-hand);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.top p{margin:0;max-width:34em;color:var(--ink-2);font:400 clamp(15px,1.9vw,19px)/1.35 var(--f-hand)}
.top .rule{width:min(560px,80%);height:1px;background:var(--rule);margin-top:10px}
/* ladder */
.ladder-wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:0 12px}
.ladder-head{display:grid;grid-template-columns:86px 112px 84px minmax(0,1fr) 210px;gap:16px;align-items:end;padding:0 0 8px;border-bottom:1px solid var(--rule);color:var(--muted);font:500 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.ladder-head .fh{display:grid;gap:4px}
.faxis{width:100%;height:auto;overflow:visible}
.faxis text{fill:var(--muted);font:500 9px var(--f-mono);letter-spacing:.04em;text-transform:none}
.ax{stroke:var(--rule);stroke-width:1;fill:none}
.tk{stroke:var(--muted);stroke-width:1;fill:none}.tk.minor{stroke:var(--rule)}
ol.ladder{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:86px 112px 84px minmax(0,1fr) 210px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--rule)}
.row:last-child{border-bottom:0}
.scale{display:grid;justify-items:end;line-height:1.05;color:var(--scale)}
.size{font:700 22px/1 var(--f-hand);white-space:nowrap}
.exp{font:400 14px/1.2 var(--f-hand);color:var(--ink-2)}

      <figcaption class="zinfo"><div class="zi" data-i="0" style="--c:var(--c-myo)">
  <div class="zi-what"><h3><span class="size">5–11 nm</span><span class="nm">Working stroke</span><span class="sub"> · one myosin head · where movement begins</span></h3><p>A myosin head binds actin, swings its lever arm, lets go and resets, sliding the rope towards the centre by up to about a hundred-thousandth of a millimetre; the step varies with the myosin and conditions. Many heads cycle on their own timing, so some always hold on. A real stroke lasts under a thousandth of a second; here it plays about 5,000 times slower.</p></div>
  <div class="zi-force"><span class="fk">force</span><svg class="fsvg" viewBox="0 0 196 22" aria-hidden="true"><path class="ax" d="M6 11 H186"/><path class="tk " d="M6.0 9 V13"/><path class="tk minor" d="M17.3 9 V13"/><path class="tk minor" d="M28.5 9 V13"/><path class="tk " d="M39.8 9 V13"/><path class="tk minor" d="M51.0 9 V13"/><path class="tk minor" d="M62.3 9 V13"/><path class="tk " d="M73.5 9 V13"/><path class="tk minor" d="M84.8 9 V13"/><path class="tk minor" d="M96.0 9 V13"/><path class="tk " d="M107.3 9 V13"/><path class="tk minor" d="M118.5 9 V13"/><path class="tk minor" d="M129.8 9 V13"/><path class="tk " d="M141.0 9 V13"/><path class="tk minor" d="M152.3 9 V13"/><path class="tk minor" d="M163.5 9 V13"/><path class="tk " d="M174.8 9 V13"/><path class="tk minor" d="M186.0 9 V13"/><path class="fbar" d="M6.0 11 H13.9"/></svg><span class="ftext">1–5 pN per head</span></div>
</div><div class="zi" data-i="1" style="--c:var(--c-actin)" aria-hidden="true">
  <div class="zi-what"><h3><span class="size">7 nm</span><span class="nm">Actin</span><span class="sub"> · the rope</span></h3><p>A twisted strand about seven millionths of a millimetre wide. Each bead is a place where a myosin head can grip, once calcium unlocks it: calcium binds troponin, which shifts the guard strand, tropomyosin, off the grip sites.</p></div>
  <div class="zi-force"><span class="fk">force</span><svg class="fsvg" viewBox="0 0 196 22" aria-hidden="true"><path class="ax" d="M6 11 H186"/><path class="tk " d="M6.0 9 V13"/><path class="tk minor" d="M17.3 9 V13"/><path class="tk minor" d="M28.5 9 V13"/><path class="tk " d="M39.8 9 V13"/><path class="tk minor" d="M51.0 9 V13"/><path class="tk minor" d="M62.3 9 V13"/><path class="tk " d="M73.5 9 V13"/><path class="tk minor" d="M84.8 9 V13"/><path class="tk minor" d="M96.0 9 V13"/><path class="tk " d="M107.3 9 V13"/><path class="tk minor" d="M118.5 9 V13"/><path class="tk minor" d="M129.8 9 V13"/><path class="tk " d="M141.0 9 V13"/><path class="tk minor" d="M152.3 9 V13"/><path class="tk minor" d="M163.5 9 V13"/><path class="tk " d="M174.8 9 V13"/><path class="tk minor" d="M186.0 9 V13"/><path class="fbar" d="M6.0 11 H13.9"/></svg><span class="ftext">1–5 pN per head</span></div>
</div><div class="zi" data-i="2" style="--c:var(--c-sarc)" aria-hidden="true">
  <div class="zi-what"><h3><span class="size">≈ 2 µm</span><span class="nm">Sarcomere</span><span class="sub"> · one compartment, ≈ 2 µm long</span></h3><p>Actin ropes and myosin bundles overlap inside a compartment about two thousandths of a millimetre long. As the heads pull, the ropes slide in from both ends towards the centre and the compartment shortens; the ropes and bundles keep their own length.</p></div>
  <div class="zi-force"><span class="fk">force</span><svg class="fsvg" viewBox="0 0 196 22" aria-hidden="true"><path class="ax" d="M6 11 H186"/><path class="tk " d="M6.0 9 V13"/><path class="tk minor" d="M17.3 9 V13"/><path class="tk minor" d="M28.5 9 V13"/><path class="tk " d="M39.8 9 V13"/><path class="tk minor" d="M51.0 9 V13"/><path class="tk minor" d="M62.3 9 V13"/><path class="tk " d="M73.5 9 V13"/><path class="tk minor" d="M84.8 9 V13"/><path class="tk minor" d="M96.0 9 V13"/><path class="tk " d="M107.3 9 V13"/><path class="tk minor" d="M118.5 9 V13"/><path class="tk minor" d="M129.8 9 V13"/><path class="tk " d="M141.0 9 V13"/><path class="tk minor" d="M152.3 9 V13"/><path class="tk minor" d="M163.5 9 V13"/><path class="tk " d="M174.8 9 V13"/><path class="tk minor" d="M186.0 9 V13"/><path class="fbar" d="M29.6 11 H37.5"/></svg><span class="ftext">≈ 0.1–0.6 nN per myosin bundle</span></div>
</div><div class="zi" data-i="3" style="--c:var(--c-fibril)" aria-hidden="true">
  <div class="zi-what"><h3><span class="size">1–2 µm</span><span class="nm">Myofibril</span><span class="sub"> · a thread, 1–2 µm across</span></h3><p>Compartments link end to end into a fine thread, one to two thousandths of a millimetre wide. Their small shortenings add up along the chain; strength comes from threads lying side by side.</p></div>
  <div class="zi-force"><span class="fk">force</span><svg class="fsvg" viewBox="0 0 196 22" aria-hidden="true"><path class="ax" d="M6 11 H186"/><path class="tk " d="M6.0 9 V13"/><path class="tk minor" d="M17.3 9 V13"/><path class="tk minor" d="M28.5 9 V13"/><path class="tk " d="M39.8 9 V13"/><path class="tk minor" d="M51.0 9 V13"/><path class="tk minor" d="M62.3 9 V13"/><path class="tk " d="M73.5 9 V13"/><path class="tk minor" d="M84.8 9 V13"/><path class="tk minor" d="M96.0 9 V13"/><path class="tk " d="M107.3 9 V13"/><path class="tk minor" d="M118.5 9 V13"/><path class="tk minor" d="M129.8 9 V13"/><path class="tk " d="M141.0 9 V13"/><path class="tk minor" d="M152.3 9 V13"/><path class="tk minor" d="M163.5 9 V13"/><path class="tk " d="M174.8 9 V13"/><path class="tk minor" d="M186.0 9 V13"/><path class="fbar" d="M65.4 11 H73.0"/></svg><span class="ftext">≈ 0.2–0.9 µN</span></div>
</div><div class="zi" data-i="4" style="--c:var(--c-fibre)" aria-hidden="true">
  <div class="zi-what"><h3><span class="size">100 µm</span><span class="nm">Muscle fibre</span><span class="sub"> · one cell</span></h3><p>One long cell, up to a tenth of a millimetre wide, packed with hundreds to thousands of threads. Their bands line up, which gives muscle its stripes.</p></div>
  <div class="zi-force"><span class="fk">force</span><svg class="fsvg" viewBox="0 0 196 22" aria-hidden="true"><path class="ax" d="M6 11 H186"/><path class="tk " d="M6.0 9 V13"/><path class="tk minor" d="M17.3 9 V13"/><path class="tk minor" d="M28.5 9 V13"/><path class="tk " d="M39.8 9 V13"/><path class="tk minor" d="M51.0 9 V13"/><path class="tk minor" d="M62.3 9 V13"/><path class="tk " d="M73.5 9 V13"/><path class="tk minor" d="M84.8 9 V13"/><path class="tk minor" d="M96.0 9 V13"/><path class="tk " d="M107.3 9 V13"/><path class="tk minor" d="M118.5 9 V13"/><path class="tk minor" d="M129.8 9 V13"/><path class="tk " d="M141.0 9 V13"/><path class="tk minor" d="M152.3 9 V13"/><path class="tk minor" d="M163.5 9 V13"/><path class="tk " d="M174.8 9 V13"/><path class="tk minor" d="M186.0 9 V13"/><path class="fbar" d="M103.6 11 H111.3"/></svg><span class="ftext">≈ 0.5–2 mN</span></div>
</div><div class="zi" data-i="5" style="--c:var(--c-fasc)" aria-hidden="true">
  <div class="zi-what"><h3><span class="size">1 mm</span><span class="nm">Muscle bundle</span><span class="sub"> · fascicle</span></h3><p>Many long, slender muscle fibres lie side by side, wrapped together in a sheath of connective tissue.</p></div>
  <div class="zi-force"><span class="fk">force</span><svg class="fsvg" viewBox="0 0 196 22" aria-hidden="true"><path class="ax" d="M6 11 H186"/><path class="tk " d="M6.0 9 V13"/><path class="tk minor" d="M17.3 9 V13"/><path class="tk minor" d="M28.5 9 V13"/><path class="tk " d="M39.8 9 V13"/><path class="tk minor" d="M51.0 9 V13"/><path class="tk minor" d="M62.3 9 V13"/><path class="tk " d="M73.5 9 V13"/><path class="tk minor" d="M84.8 9 V13"/><path class="tk minor" d="M96.0 9 V13"/><path class="tk " d="M107.3 9 V13"/><path class="tk minor" d="M118.5 9 V13"/><path class="tk minor" d="M129.8 9 V13"/><path class="tk " d="M141.0 9 V13"/><path class="tk minor" d="M152.3 9 V13"/><path class="tk minor" d="M163.5 9 V13"/><path class="tk " d="M174.8 9 V13"/><path class="tk minor" d="M186.0 9 V13"/><path class="fbar" d="M128.3 11 H135.1"/></svg><span class="ftext">≈ 0.08–0.3 N</span></div>
</div><div class="zi" data-i="6" style="--c:var(--c-belly)" aria-hidden="true">
  <div class="zi-what"><h3><span class="size">3–4 cm</span><span class="nm">Muscle</span><span class="sub"> · the quadriceps</span></h3><p>Many bundles lie side by side to make the quadriceps, about 3–4 cm thick at the front of the thigh. Tendons gather their pull and pass it to bone.</p></div>
  <div class="zi-force"><span class="fk">force</span><svg class="fsvg" viewBox="0 0 196 22" aria-hidden="true"><path class="ax" d="M6 11 H186"/><path class="tk " d="M6.0 9 V13"/><path class="tk minor" d="M17.3 9 V13"/><path class="tk minor" d="M28.5 9 V13"/><path class="tk " d="M39.8 9 V13"/><path class="tk minor" d="M51.0 9 V13"/><path class="tk minor" d="M62.3 9 V13"/><path class="tk " d="M73.5 9 V13"/><path class="tk minor" d="M84.8 9 V13"/><path class="tk minor" d="M96.0 9 V13"/><path class="tk " d="M107.3 9 V13"/><path class="tk minor" d="M118.5 9 V13"/><path class="tk minor" d="M129.8 9 V13"/><path class="tk " d="M141.0 9 V13"/><path class="tk minor" d="M152.3 9 V13"/><path class="tk minor" d="M163.5 9 V13"/><path class="tk " d="M174.8 9 V13"/><path class="tk minor" d="M186.0 9 V13"/><path class="fbar" d="M178.1 11 H187.4"/></svg><span class="ftext">≈ 2–13 kN (illustrative estimate, hard effort)</span></div>
</div><div class="zi" data-i="7" style="--c:var(--c-limb)" aria-hidden="true">
  <div class="zi-what"><h3><span class="size">≈ 40 cm</span><span class="nm">Leg</span><span class="sub"> · the knee as a lever</span></h3><p>The quadriceps crosses the knee and pulls on the shin a few centimetres below the joint, while the foot sits about 40 cm away. The shin works as a lever: only part of the pull reaches the foot, traded for speed and reach, and that share changes with knee angle and load.</p></div>
  <div class="zi-force"><span class="fk">force</span><svg class="fsvg" viewBox="0 0 196 22" aria-hidden="true"><path class="ax" d="M6 11 H186"/><path class="tk " d="M6.0 9 V13"/><path class="tk minor" d="M17.3 9 V13"/><path class="tk minor" d="M28.5 9 V13"/><path class="tk " d="M39.8 9 V13"/><path class="tk minor" d="M51.0 9 V13"/><path class="tk minor" d="M62.3 9 V13"/><path class="tk " d="M73.5 9 V13"/><path class="tk minor" d="M84.8 9 V13"/><path class="tk minor" d="M96.0 9 V13"/><path class="tk " d="M107.3 9 V13"/><path class="tk minor" d="M118.5 9 V13"/><path class="tk minor" d="M129.8 9 V13"/><path class="tk " d="M141.0 9 V13"/><path class="tk minor" d="M152.3 9 V13"/><path class="tk minor" d="M163.5 9 V13"/><path class="tk " d="M174.8 9 V13"/><path class="tk minor" d="M186.0 9 V13"/><path class="fbar" d="M167.0 11 H176.8"/></svg><span class="ftext">≈ 0.2–1.5 kN at the foot (illustrative estimate)</span></div>
</div><div class="zi" data-i="8" style="--c:var(--c-body)" aria-hidden="true">
  <div class="zi-what"><h3><span class="size">1.7 m</span><span class="nm">Whole body</span><span class="sub"> · standing height</span></h3><p>The visible form of movement: prompted by nerve signals, many muscles act together across many joints.</p></div>

<script type="module">const M = {"P":{"ox":380,"oy":249.07914489136553,"k":4.928629146163556,"sinA":0.992546151641322,"cosA":0.12186934340514749,"sinE":0.25881904510252074,"cosE":0.9659258262890683},"REPEAT":36,"RISE":2.769230769230769,"TWIST":-166.15384615384616,"ACTIN_Z":30,"HEADS_X":[-42.900000000000006,0,42.900000000000006],"LEVER":9,"PSI_PRE":-1.1868238913561442,"PSI_POST":-2.129301687433082,"MOTOR":[-2.6,7.6],"BIND_Z":28.6,"HEAD_Y":2.8,"THICK_R":6.5,"STATES":[["detach","ATP binds · head lets go"],["recovery","ATP split · head re-cocks"],["weak","Head binds actin"],["pi","Phosphate out · grip tightens"],["stroke","Power stroke"],["adp","ADP out · holds on until next ATP"]]};

const SPH = [];

  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);

  const lo = [];

// Nucleotide: where each piece sits and how visible it is, by phase.

const LABEL_TEXT = {

  placeLabel(follow.lever, lm, [lm[0] - 12, lm[1], lm[2] - 3.2]);

  placeLabel(follow.s2, sm, [A[0] + 6, A[1], A[2] + 4.5]);

  const verb = "myosin head · " + VERB[h.phase];

  follow.pocket.text.textContent = nuc.tag === "empty" ? "empty" : nuc.tag === "ADP·Pi" ? "ADP + phosphate" : nuc.tag;

// ---------- loop, controls, accessibility ----------------------------------------------------

let last = 0;

};

bPlay.addEventListener("click", () => setPlaying(!playing));

  many = on;
  bMany.setAttribute("aria-pressed", String(on));

    if (j === 1) return;
    if (on && h.parked) { h.parked = false; h.t = -0.9 * j; enter(h, "weak"); h.t = -1.6 * (j === 0 ? 1 : 0.4); }

<script type="module">
const zoom = document.querySelector(".zoom");

const zin = zoom.querySelector(".zin"), zout = zoom.querySelector(".zout");
const stage = zoom.querySelector(".stagebox");
const N = views.length;

  const k = Math.min(W / 190, H / 93), w = 190 * k, h = 93 * k;

  zoom.querySelector(".zs-n").textContent = level + 1;
  zoom.querySelector(".zs-name").textContent = names[level];
  stage.style.cursor = dir > 0 ? "zoom-out" : "zoom-in";
  stage.setAttribute("aria-label", "Zoom " + (dir > 0 ? "out" : "in") + " to " + names[level + dir]);
  zoom.dataset.level = level;
};
const next = () => go(level + dir);
stage.addEventListener("click", (e) => { if (e.target.closest(".v0ctl")) return; if (e.target.closest(".ps-stage") && e.detail === 0) return; next(); });
stage.addEventListener("keydown", (e) => { if (e.target === stage && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); } });
zout.addEventListener("click", () => { dir = 1; go(level + 1); });
zin.addEventListener("click", () => { dir = -1; go(level - 1); });
rungs.forEach((b) => b.addEventListener("click", () => { dir = +b.dataset.go >= level ? 1 : -1; go(+b.dataset.go); }));
views.forEach((v, i) => { if (i) { v.style.transformOrigin = at(FOCUS[i]); v.classList.add("big"); } });
go(0);
// one shared clock: every static scale contracts and relaxes in phase
let t0 = performance.now();
const beat = (now) => {
  const k = reduce.matches ? 0 : 0.5 - 0.5 * Math.cos((2 * Math.PI * (now - t0)) / 3600);
  zoom.style.setProperty("--k", k.toFixed(3));
  requestAnimationFrame(beat);
};
requestAnimationFrame(beat);

// theme toggle
const root = document.documentElement;
const tbTheme = document.querySelector(".tb-theme");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
try { const q = new URLSearchParams(location.search).get("theme"); if (q === "light" || q === "dark") root.dataset.theme = q; } catch (e) {}
const paintToggle = () => { const d = isDark(); tbTheme.dataset.dark = d ? "1" : "0"; tbTheme.setAttribute("aria-label", d ? "Switch to light theme" : "Switch to dark theme"); tbTheme.title = d ? "Light theme" : "Dark theme"; };
tbTheme.addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; paintToggle(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintToggle);
new MutationObserver(paintToggle).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
paintToggle();

</script>
